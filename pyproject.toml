[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openstudio-toolkit"
version = "0.2.0"
authors = [
    { name = "Roberto Ruiz", email = "roruizf@gmail.com" },
]
description = "A Python library for structured access to OpenStudio models for building energy simulation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openstudio==3.10.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/roruizf/OpenStudio-Toolkit"
Issues = "https://github.com/roruizf/OpenStudio-Toolkit/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openstudio_toolkit = [
    "resources/measures/**/*",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["openstudio_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
